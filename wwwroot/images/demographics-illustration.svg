<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none">
  <defs>
    <linearGradient id="chartGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e6990" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3e6990" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c96a86" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c96a86" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="barMale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c84b8" />
      <stop offset="100%" stop-color="#2c4d6c" />
    </linearGradient>
    <linearGradient id="barFemale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e285a2" />
      <stop offset="100%" stop-color="#a04d65" />
    </linearGradient>
  </defs>

  <!-- Grid lines -->
  <line x1="40" y1="40" x2="480" y2="40" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="40" y1="100" x2="480" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="40" y1="160" x2="480" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="40" y1="220" x2="480" y2="220" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="40" y1="260" x2="480" y2="260" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Bar Charts (Comparative Demographics) -->
  <!-- 2018 -->
  <rect x="65" y="170" width="16" height="90" rx="3" fill="url(#barMale)" />
  <rect x="85" y="178" width="16" height="82" rx="3" fill="url(#barFemale)" />
  <text x="83" y="280" fill="rgba(255,255,255,0.6)" font-size="11" font-family="sans-serif" text-anchor="middle">2018</text>

  <!-- 2020 -->
  <rect x="145" y="150" width="16" height="110" rx="3" fill="url(#barMale)" />
  <rect x="165" y="158" width="16" height="102" rx="3" fill="url(#barFemale)" />
  <text x="163" y="280" fill="rgba(255,255,255,0.6)" font-size="11" font-family="sans-serif" text-anchor="middle">2020</text>

  <!-- 2022 -->
  <rect x="225" y="130" width="16" height="130" rx="3" fill="url(#barMale)" />
  <rect x="245" y="137" width="16" height="123" rx="3" fill="url(#barFemale)" />
  <text x="243" y="280" fill="rgba(255,255,255,0.6)" font-size="11" font-family="sans-serif" text-anchor="middle">2022</text>

  <!-- 2024 (Recorded) -->
  <rect x="305" y="110" width="16" height="150" rx="3" fill="url(#barMale)" />
  <rect x="325" y="117" width="16" height="143" rx="3" fill="url(#barFemale)" />
  <text x="323" y="280" fill="rgba(255,255,255,0.6)" font-size="11" font-family="sans-serif" text-anchor="middle">2024</text>

  <!-- 2030 (Predicted Highlighted) -->
  <rect x="385" y="80" width="16" height="180" rx="3" fill="#b9812e" opacity="0.85" />
  <rect x="405" y="86" width="16" height="174" rx="3" fill="#c96a86" opacity="0.85" />
  <text x="403" y="280" fill="#e0a950" font-weight="bold" font-size="11" font-family="sans-serif" text-anchor="middle">2030 (ML)</text>

  <!-- Trend Curve Line Overlay -->
  <path d="M75 160 Q 155 140, 235 120 T 315 100 T 395 72" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
  <circle cx="75" cy="160" r="4" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
  <circle cx="155" cy="140" r="4" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
  <circle cx="235" cy="120" r="4" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
  <circle cx="315" cy="100" r="4" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
  <circle cx="395" cy="72" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />

  <!-- Badge Prediction Line -->
  <line x1="395" y1="72" x2="455" y2="45" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />
  <rect x="440" y="32" width="70" height="22" rx="11" fill="rgba(245,158,11,0.25)" stroke="#f59e0b" stroke-width="1" />
  <text x="475" y="47" fill="#fbbf24" font-size="10.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">+14.2% ML</text>
</svg>
